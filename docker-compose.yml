services:
  db:
    image: mysql:8.0
    container_name: cardapio_db
    restart: always
    environment:
      MYSQL_DATABASE: cardapio
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: cardapio_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./cardapio-backend
      dockerfile: Dockerfile
    container_name: cardapio_backend
    volumes:
      - ./cardapio-backend:/var/www
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  web:
    image: nginx:alpine
    container_name: cardapio_web
    volumes:
      - ./cardapio-backend:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy

  queue-worker:
    build:
      context: ./cardapio-backend
      dockerfile: Dockerfile
    container_name: cardapio_queue_worker
    command: php artisan queue:work redis --tries=3 --timeout=90
    volumes:
      - ./cardapio-backend:/var/www
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
