<article
  class="flex h-full flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:border-red-200 hover:shadow-lg"
>
  <div class="flex items-center justify-between gap-3">
    <span class="rounded-md bg-red-50 px-2.5 py-1 text-xs font-bold uppercase tracking-wide text-red-700">
      {{ item.category }}
    </span>
    <span class="whitespace-nowrap text-lg font-bold text-green-700">
      {{ item.price | currency:'BRL':'symbol':'1.2-2' }}
    </span>
  </div>
  <h2 class="text-xl font-bold leading-snug text-slate-900">{{ item.name }}</h2>
  <p class="flex-1 text-sm leading-relaxed text-slate-600">{{ item.description }}</p>
  <button
    class="self-start rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-red-700 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600"
    type="button"
    (click)="addToCart.emit(item)"
  >
    Adicionar ao carrinho
  </button>
</article>
